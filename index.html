<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The List</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F4F5F1;
    --paper-raised: #FFFFFF;
    --ink: #1F2A24;
    --ink-soft: #5B6A61;
    --line: #DCE0D8;
    --pine: #3E6259;
    --pine-deep: #2C463F;
    --gold: #B98E2F;
    --danger: #A4483A;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 64px 24px 96px;
  }

  /* subtle paper grain via layered gradients, no external image */
  body::before{
    content:"";
    position: fixed;
    inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0, transparent 40%);
  }

  .sheet{
    width: 100%;
    max-width: 560px;
  }

  header.masthead{
    margin-bottom: 40px;
  }

  .date-line{
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
    margin-bottom: 10px;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 40px;
    line-height: 1.1;
    margin: 0 0 8px;
    color: var(--pine-deep);
  }

  .subhead{
    font-size: 14.5px;
    color: var(--ink-soft);
    max-width: 40ch;
    line-height: 1.5;
  }

  /* --- add row --- */
  .add-row{
    display:flex;
    align-items:center;
    gap: 12px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 4px 4px 4px 18px;
    margin: 32px 0 28px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  .add-row:focus-within{
    border-color: var(--pine);
    box-shadow: 0 0 0 3px rgba(62,98,89,0.12);
  }

  .add-row input[type="text"]{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--ink);
    padding: 14px 0;
  }

  .add-row input[type="text"]::placeholder{
    color: #9AA79E;
  }

  .add-btn{
    flex-shrink:0;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border:none;
    background: var(--pine);
    color: #fff;
    font-size: 20px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .15s ease, transform .1s ease;
  }

  .add-btn:hover{ background: var(--pine-deep); }
  .add-btn:active{ transform: scale(0.94); }

  /* --- filters --- */
  .filters{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 6px;
    padding: 0 2px;
  }

  .filter-tabs{
    display:flex;
    gap: 4px;
  }

  .filter-tabs button{
    border:none;
    background:transparent;
    color: var(--ink-soft);
    font-family:'Inter', sans-serif;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor:pointer;
    transition: color .15s ease, background .15s ease;
  }

  .filter-tabs button:hover{ color: var(--ink); }

  .filter-tabs button.active{
    color: var(--pine-deep);
    background: rgba(62,98,89,0.1);
    font-weight: 500;
  }

  .count-line{
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* --- list --- */
  .list{
    list-style:none;
    margin: 18px 0 0;
    padding:0;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow:hidden;
  }

  .item{
    display:flex;
    align-items:flex-start;
    gap: 14px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    position:relative;
  }

  .item:last-child{ border-bottom:none; }

  .checkbox{
    flex-shrink:0;
    width: 20px;
    height: 20px;
    margin-top: 1px;
    border-radius: 5px;
    border: 1.5px solid #B8C3BC;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background: transparent;
    transition: border-color .15s ease, background .15s ease;
  }

  .checkbox:hover{ border-color: var(--pine); }

  .item.done .checkbox{
    background: var(--pine);
    border-color: var(--pine);
  }

  .checkbox svg{
    width: 12px;
    height: 12px;
    opacity:0;
    transform: scale(0.6);
    transition: opacity .12s ease, transform .12s ease;
  }

  .item.done .checkbox svg{ opacity:1; transform: scale(1); }

  .item-body{
    flex:1;
    min-width:0;
  }

  .item-text{
    font-size: 15px;
    line-height: 1.45;
    color: var(--ink);
    word-break: break-word;
    outline:none;
    cursor:text;
  }

  .item.done .item-text{
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: #B8C3BC;
  }

  .item-meta{
    font-size: 12px;
    color: #9AA79E;
    margin-top: 3px;
  }

  .remove-btn{
    flex-shrink:0;
    border:none;
    background:transparent;
    color: #B8C3BC;
    cursor:pointer;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition: opacity .12s ease, color .12s ease, background .12s ease;
  }

  .item:hover .remove-btn{ opacity:1; }
  .remove-btn:hover{ color: var(--danger); background: rgba(164,72,58,0.08); }
  .remove-btn svg{ width:14px; height:14px; }

  /* --- empty state --- */
  .empty{
    padding: 56px 24px;
    text-align:center;
  }

  .empty-mark{
    font-family:'Fraunces', serif;
    font-size: 28px;
    color: var(--pine);
    margin-bottom: 6px;
  }

  .empty-text{
    font-size: 14px;
    color: var(--ink-soft);
  }

  /* --- footer --- */
  .list-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 20px 4px 0;
  }

  .list-footer span{
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .clear-btn{
    border:none;
    background:transparent;
    color: var(--ink-soft);
    font-size: 12.5px;
    cursor:pointer;
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 3px;
    transition: color .15s ease;
  }

  .clear-btn:hover{ color: var(--danger); }

  @media (max-width: 480px){
    h1{ font-size: 32px; }
    body{ padding: 40px 16px 72px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<div class="sheet">
  <header class="masthead">
    <div class="date-line" id="dateLine"></div>
    <h1>The List</h1>
    <p class="subhead">Write down what needs doing, then cross it off as you go.</p>
  </header>

  <form class="add-row" id="addForm">
    <input type="text" id="taskInput" placeholder="Add something to do…" autocomplete="off" maxlength="200">
    <button type="submit" class="add-btn" aria-label="Add task">+</button>
  </form>

  <div class="filters">
    <div class="filter-tabs" id="filterTabs">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </div>
    <div class="count-line" id="countLine"></div>
  </div>

  <ul class="list" id="list"></ul>

  <div class="list-footer" id="listFooter" style="display:none;">
    <span id="footerSummary"></span>
    <button class="clear-btn" id="clearDone">Clear completed</button>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'the-list.tasks.v1';

  const listEl = document.getElementById('list');
  const addForm = document.getElementById('addForm');
  const taskInput = document.getElementById('taskInput');
  const filterTabs = document.getElementById('filterTabs');
  const countLine = document.getElementById('countLine');
  const listFooter = document.getElementById('listFooter');
  const footerSummary = document.getElementById('footerSummary');
  const clearDoneBtn = document.getElementById('clearDone');
  const dateLine = document.getElementById('dateLine');

  let tasks = [];
  let filter = 'all';

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : [];
    }catch(e){
      tasks = [];
    }
  }

  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }catch(e){ /* storage unavailable — app still works this session */ }
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function setDate(){
    const now = new Date();
    dateLine.textContent = now.toLocaleDateString(undefined, {
      weekday: 'long', month: 'long', day: 'numeric'
    });
  }

  function checkIcon(){
    return '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8.5L6.2 11.7L13 4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function trashIcon(){
    return '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 4.5H13.5M6 4.5V3a1 1 0 011-1h2a1 1 0 011 1v1.5M6.5 7.5V11.5M9.5 7.5V11.5M3.5 4.5L4.2 13a1 1 0 001 1h5.6a1 1 0 001-1L12.5 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function render(){
    const visible = tasks.filter(t => {
      if(filter === 'active') return !t.done;
      if(filter === 'done') return t.done;
      return true;
    });

    listEl.innerHTML = '';

    if(tasks.length === 0){
      listEl.innerHTML = '<div class="empty"><div class="empty-mark">✓</div><div class="empty-text">Nothing on the list yet. Add your first task above.</div></div>';
    } else if(visible.length === 0){
      const msg = filter === 'done' ? "Nothing completed yet." : "Nothing active — you're all caught up.";
      listEl.innerHTML = `<div class="empty"><div class="empty-mark">·</div><div class="empty-text">${msg}</div></div>`;
    } else {
      visible.forEach(task => {
        const li = document.createElement('li');
        li.className = 'item' + (task.done ? ' done' : '');
        li.dataset.id = task.id;
        li.innerHTML = `
          <button class="checkbox" aria-label="Toggle complete">${checkIcon()}</button>
          <div class="item-body">
            <div class="item-text" contenteditable="true" spellcheck="false">${escapeHtml(task.text)}</div>
          </div>
          <button class="remove-btn" aria-label="Delete task">${trashIcon()}</button>
        `;
        listEl.appendChild(li);
      });
    }

    const total = tasks.length;
    const doneCount = tasks.filter(t => t.done).length;
    countLine.textContent = total ? `${doneCount} of ${total} done` : '';

    if(total > 0){
      listFooter.style.display = 'flex';
      const remaining = total - doneCount;
      footerSummary.textContent = `${remaining} task${remaining === 1 ? '' : 's'} remaining`;
    } else {
      listFooter.style.display = 'none';
    }

    save();
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  addForm.addEventListener('submit', e => {
    e.preventDefault();
    const val = taskInput.value.trim();
    if(!val) return;
    tasks.unshift({ id: uid(), text: val, done: false });
    taskInput.value = '';
    render();
  });

  listEl.addEventListener('click', e => {
    const item = e.target.closest('.item');
    if(!item) return;
    const id = item.dataset.id;

    if(e.target.closest('.checkbox')){
      const t = tasks.find(t => t.id === id);
      if(t){ t.done = !t.done; render(); }
    }

    if(e.target.closest('.remove-btn')){
      item.style.transition = 'opacity .15s ease';
      item.style.opacity = '0';
      setTimeout(() => {
        tasks = tasks.filter(t => t.id !== id);
        render();
      }, 120);
    }
  });

  listEl.addEventListener('blur', e => {
    if(!e.target.classList || !e.target.classList.contains('item-text')) return;
    const item = e.target.closest('.item');
    const id = item.dataset.id;
    const t = tasks.find(t => t.id === id);
    const newText = e.target.textContent.trim();
    if(t){
      if(newText){
        t.text = newText;
      } else {
        tasks = tasks.filter(t => t.id !== id);
      }
      render();
    }
  }, true);

  listEl.addEventListener('keydown', e => {
    if(e.target.classList && e.target.classList.contains('item-text') && e.key === 'Enter'){
      e.preventDefault();
      e.target.blur();
    }
  });

  filterTabs.addEventListener('click', e => {
    const btn = e.target.closest('button[data-filter]');
    if(!btn) return;
    filter = btn.dataset.filter;
    [...filterTabs.children].forEach(b => b.classList.toggle('active', b === btn));
    render();
  });

  clearDoneBtn.addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    render();
  });

  load();
  setDate();
  render();
})();
</script>

</body>
</html>
